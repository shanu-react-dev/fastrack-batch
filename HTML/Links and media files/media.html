<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Media Files In HTML</h1>
    <img
      src="https://d2pn8kiwq2w21t.cloudfront.net/original_images/jpegPIA16695.jpg"
      alt="black hole"
      height="300px"
      width="400px"
    />

    <img
      src="./Screenshot 2026-05-11 132854.png"
      alt="my image"
      height="300px"
      width="260px"
    />
    <video
      src="./batman.mp4"
      height="300px"
      width="270px"
      controls
      autoplay
      muted
      loop
    ></video>

    <audio src="./mysong.mp3" controls autoplay loop muted></audio>
    <img src="../Intro to HTML and formatting tags/computer.png" alt="" />

    <iframe
      src="./index.html"
      width="100%"
      height="500px"
      frameborder="0"
    ></iframe>

    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/h5-Kq9k3zeo?si=_eP75gWy48bG4R8r"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>

    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2699.0448721152206!2d80.14196286019332!3d12.956848676191205!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a525e4ca559c68f%3A0x1e3e6d4bcd550206!2sQSpiders%20Chennai%20Chromepet!5e0!3m2!1sen!2sin!4v1791525337222!5m2!1sen!2sin"
      width="600"
      height="450"
      style="border: 0"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>

    <marquee behavior="alternate" direction="right">Hello I am Shanu</marquee>
    <object data="" type=""></object>
    <embed src="" type="" />
  </body>
</html>
